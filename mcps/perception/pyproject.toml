[project]
name = "active-geo-perception-mcp"
version = "0.1.0"
description = "Local perception MCP tools for active street-level geolocation."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastmcp>=2.0.0",
    "fast-alpr[onnx-gpu]>=0.4.0",
    "geopy>=2.4",
    "mcp>=1.5.0",
    "numpy>=1.26",
    "opencv-python>=4.12.0.88,<4.13",
    "opencv-python-headless>=4.12.0.88,<4.13",
    "pillow>=10.0",
    "rapidocr>=3.8.1"
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["perception_mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
